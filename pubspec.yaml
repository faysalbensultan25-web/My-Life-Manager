name: my_life_manager
description: A personal life management application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (বহুভাষিক সাপোর্টের জন্য - এটি আপনার বিল্ড এরর ঠিক করবে)
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  provider: ^6.1.1

  # Database (ডেটা সেভ করার জন্য)
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI, Charts & Fonts
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0

  # Utilities
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
