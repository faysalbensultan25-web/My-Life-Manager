name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Generate Android Folder
        run: flutter create --platforms=android --project-name my_life_manager .
        
      - name: Fix Kotlin Version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.20"/g' android/settings.gradle
          if grep -q "ext.kotlin_version" android/build.gradle; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.20"/g' android/build.gradle
          else
            echo "ext.kotlin_version not found, skipping"
          fi
          
      - name: Fix AAPT2 and CompileSdk
        run: |
          if grep -q "compileSdk" android/app/build.gradle; then
            sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
